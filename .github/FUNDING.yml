# Support NilaMind

NilaMind is built and maintained by one person as a labor of love — a privacy-first, fully on-device mental wellness companion that will never collect your data.

If NilaMind has helped you or someone you care about, here are ways to support it:

## Financial Support

- **GitHub Sponsors:** https://github.com/sponsors/sampathmannam
- **Ko-fi:** https://ko-fi.com/sampathmannam

## Non-Financial Support

- **Star the repo** — it helps others find the project
- **Share your story** — tell someone who might benefit
- **Contribute** — code, translations, documentation, or testing (see [CONTRIBUTING.md](CONTRIBUTING.md))
- **Spread the word** — share on social media, with your therapist, in mental health communities

Every star, share, and kind word makes a difference. Thank you.
